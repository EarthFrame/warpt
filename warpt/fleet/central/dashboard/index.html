<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warpt ER — fleet ward board</title>
<style>
/* ————— warpt ER control room ————— */
:root {
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-mut: #898781;
  --grid: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,.10);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --s-util: #3987e5; --s-temp: #d95926; --s-power: #199e70; --s-mem: #9085e9;
  --accent: #3987e5;
}
@media (prefers-color-scheme: light) {
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-mut: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --ring: rgba(11,11,11,.10);
    --s-util: #2a78d6; --s-temp: #eb6834; --s-power: #1baf7a; --s-mem: #4a3aa7;
    --accent: #2a78d6;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: .01em;
  background-image: radial-gradient(circle at 50% -20%, rgba(57,135,229,.06), transparent 60%);
}
a { color: inherit; }

/* — top bar — */
header {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; border-bottom: 1px solid var(--ring);
  position: sticky; top: 0; background: var(--page); z-index: 10;
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: .06em; }
.brand .er { color: var(--critical); }
.brand small { color: var(--ink-mut); font-weight: 400; margin-left: 10px; letter-spacing: .12em; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-mut); }
.pulse.live { background: var(--good); animation: beat 2s ease-in-out infinite; }
@keyframes beat { 0%,100% { box-shadow: 0 0 0 0 rgba(12,163,12,.5);} 50% { box-shadow: 0 0 0 6px rgba(12,163,12,0);} }
.tokenbox input {
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--ring);
  border-radius: 6px; padding: 5px 10px; font: inherit; width: 210px;
}
.tokenbox input:focus { outline: 1px solid var(--accent); }

/* — layout — */
main {
  display: grid; gap: 14px; padding: 16px 20px 28px;
  grid-template-columns: minmax(0, 1fr) 360px;
  grid-template-areas: "board rail" "vitals rail" "feed rail";
}
@media (max-width: 1100px) { main { grid-template-columns: 1fr; grid-template-areas: "board" "vitals" "rail" "feed"; } }
section h2 {
  font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-mut); margin-bottom: 10px;
}
section h2 .count { color: var(--ink-2); }

/* — ward board (nodes) — */
#board { grid-area: board; }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.node {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 12px 14px; cursor: pointer; position: relative; overflow: hidden;
  transition: transform .12s ease, border-color .12s ease;
}
.node:hover { transform: translateY(-1px); border-color: var(--ink-mut); }
.node.selected { border-color: var(--accent); }
.node::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--health-color, var(--ink-mut));
}
.node .host { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .meta { color: var(--ink-mut); font-size: 11px; margin-top: 2px; }
.node .stats { display: flex; gap: 14px; margin-top: 10px; }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mut); }
.node .energy { color: var(--ink-mut); font-size: 11px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.node .energy .bolt { color: var(--s-power); }
.health { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 10px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--health-color, var(--ink-mut)); }
.empty { color: var(--ink-mut); padding: 24px; text-align: center; border: 1px dashed var(--ring); border-radius: 10px; }

/* — vitals charts — */
#vitals { grid-area: vitals; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.chart {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 12px 6px;
}
.chart .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.chart .now { float: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: 110px; display: block; }
.chart .axis { stroke: var(--baseline); stroke-width: 1; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .crosshair { stroke: var(--ink-mut); stroke-dasharray: 3 3; }
.chart .ticktext { fill: var(--ink-mut); font-size: 9px; font-family: inherit; }
.tooltip {
  position: fixed; pointer-events: none; z-index: 50; display: none;
  background: var(--surface-2); border: 1px solid var(--ring); border-radius: 6px;
  padding: 6px 9px; font-size: 11px; color: var(--ink);
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
}
.tooltip .t { color: var(--ink-mut); }

/* — case rail — */
#rail { grid-area: rail; }
.case {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 11px 13px; margin-bottom: 9px; cursor: pointer;
  transition: border-color .12s ease;
}
.case:hover { border-color: var(--ink-mut); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; }
.sev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sev.critical { color: var(--critical); }
.sev.warning  { color: var(--warning); }
.sev.serious  { color: var(--serious); }
.sev.info     { color: var(--good); }
.case .title { font-weight: 700; margin: 4px 0 2px; font-size: 12.5px; }
.case .sub { color: var(--ink-mut); font-size: 11px; }
.case .hyp { color: var(--ink-2); font-size: 12px; margin-top: 5px; }
.case .conf { float: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* — case detail drawer — */
#drawer {
  position: fixed; inset: 0 0 0 auto; width: min(560px, 96vw); z-index: 40;
  background: var(--surface); border-left: 1px solid var(--ring);
  transform: translateX(102%); transition: transform .22s ease; overflow-y: auto;
  box-shadow: -24px 0 60px rgba(0,0,0,.45); padding: 22px 24px 40px;
}
#drawer.open { transform: none; }
#drawer .close { float: right; background: none; border: 1px solid var(--ring); color: var(--ink-2);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
#drawer h3 { font-size: 16px; margin: 10px 0 2px; }
#drawer .kv { margin: 14px 0 0; }
#drawer .kv dt { color: var(--ink-mut); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-top: 13px; }
#drawer .kv dd { margin: 3px 0 0; color: var(--ink-2); font-size: 12.5px; white-space: pre-wrap; }
#drawer .chain li { margin: 5px 0; color: var(--ink-2); font-size: 12.5px; }
#drawer .verdict { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10.5px;
  border: 1px solid var(--ring); color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.badge { display: inline-block; background: var(--surface-2); border: 1px solid var(--ring);
  border-radius: 5px; padding: 1px 7px; font-size: 11px; color: var(--ink-2); margin: 2px 3px 0 0; }

/* — live feed — */
#feed { grid-area: feed; }
.feedlog {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  max-height: 300px; overflow-y: auto; padding: 6px 0;
}
.entry { display: grid; grid-template-columns: 78px 92px 1fr; gap: 10px; padding: 5px 14px;
  border-bottom: 1px solid var(--grid); font-size: 12px; animation: arrive .35s ease; }
.entry:last-child { border-bottom: none; }
@keyframes arrive { from { opacity: 0; transform: translateY(-4px);} to { opacity: 1; } }
.entry .ts { color: var(--ink-mut); font-variant-numeric: tabular-nums; }
.entry .agent { color: var(--accent); font-weight: 700; }
.entry .what { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .what b { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="brand">warpt <span class="er">ER</span><small>FLEET WARD BOARD</small></div>
  <div class="tokenbox"><input id="token" type="password" placeholder="fleet token" autocomplete="off"></div>
  <div class="conn"><span class="pulse" id="pulse"></span><span id="connlabel">connecting…</span></div>
</header>

<main>
  <section id="board">
    <h2>Nodes <span class="count" id="nodecount"></span> <span class="count" id="fleetenergy"></span></h2>
    <div class="nodes" id="nodes"><div class="empty">waiting for first heartbeat…</div></div>
  </section>

  <section id="vitals">
    <h2>Vitals — <span id="vitalshost" style="color:var(--ink-2)">select a node</span></h2>
    <div class="charts" id="charts"></div>
  </section>

  <section id="rail">
    <h2>Open cases <span class="count" id="casecount"></span></h2>
    <div id="cases"><div class="empty">no open cases</div></div>
  </section>

  <section id="feed">
    <h2>Agent activity — live</h2>
    <div class="feedlog" id="feedlog"></div>
  </section>
</main>

<aside id="drawer" aria-hidden="true"></aside>
<div class="tooltip" id="tooltip"></div>

<script>
"use strict";
/* ————— state ————— */
const $ = (id) => document.getElementById(id);
let TOKEN = localStorage.getItem("warpt_fleet_token") || "";
$("token").value = TOKEN;
$("token").addEventListener("change", () => {
  TOKEN = $("token").value.trim();
  localStorage.setItem("warpt_fleet_token", TOKEN);
  boot();
});
let selectedNode = null;
let streamAbort = null;

const H = () => TOKEN ? { "Authorization": "Bearer " + TOKEN } : {};
const api = async (path) => {
  const r = await fetch(path, { headers: H() });
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
const fmtAge = (iso) => {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return Math.max(0, Math.round(s)) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
};
const hhmmss = (iso) => (iso || "").slice(11, 19) || "—";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ————— nodes (ward board) ————— */
function fmtKwh(kwh) {
  if (kwh == null) return "—";
  return kwh >= 1 ? kwh.toFixed(1) + " kWh" : (kwh * 1000).toFixed(0) + " Wh";
}
function fmtCo2(g) {
  if (g == null) return "—";
  return g >= 1000 ? (g / 1000).toFixed(1) + " kg CO₂" : g.toFixed(0) + " g CO₂";
}
function energyLine(n) {
  if (n.energy_kwh == null) return "";
  return `<div class="energy"><span class="bolt">⚡</span> ${fmtKwh(n.energy_kwh)} · ${fmtCo2(n.co2_grams)} · $${(n.cost_usd ?? 0).toFixed(2)}</div>`;
}
function health(n) {
  const beat = n.last_heartbeat ? (Date.now() - new Date(n.last_heartbeat).getTime()) / 1000 : Infinity;
  if (beat > 120) return { key: "offline", label: "no heartbeat", color: "var(--ink-mut)" };
  if (n.critical_cases > 0) return { key: "critical", label: "critical", color: "var(--critical)" };
  if (n.open_cases > 0) return { key: "warning", label: "open cases", color: "var(--warning)" };
  return { key: "good", label: "healthy", color: "var(--good)" };
}

async function refreshNodes() {
  const nodes = await api("/api/v1/nodes");
  $("nodecount").textContent = nodes.length ? "· " + nodes.length : "";
  const totalKwh = nodes.reduce((sum, n) => sum + (n.energy_kwh || 0), 0);
  $("fleetenergy").textContent =
    nodes.some(n => n.energy_kwh != null) ? "· ⚡ " + fmtKwh(totalKwh) + " total" : "";
  const box = $("nodes");
  if (!nodes.length) { box.innerHTML = '<div class="empty">no nodes have reported yet</div>'; return; }
  box.innerHTML = nodes.map(n => {
    const h = health(n);
    return `<div class="node ${n.node_id === selectedNode ? "selected" : ""}" data-id="${esc(n.node_id)}"
       style="--health-color:${h.color}">
      <div class="host">${esc(n.hostname || n.node_id.slice(0, 12))}</div>
      <div class="meta">${esc(n.node_id.slice(0, 12))} · beat ${fmtAge(n.last_heartbeat)}</div>
      <div class="stats">
        <div class="stat"><div class="v">${n.open_cases}</div><div class="k">open</div></div>
        <div class="stat"><div class="v">${n.critical_cases}</div><div class="k">critical</div></div>
      </div>
      ${energyLine(n)}
      <div class="health"><span class="dot"></span>${h.label}</div>
    </div>`;
  }).join("");
  box.querySelectorAll(".node").forEach(el =>
    el.addEventListener("click", () => selectNode(el.dataset.id, el.querySelector(".host").textContent)));
  if (!selectedNode && nodes.length) selectNode(nodes[0].node_id, nodes[0].hostname);
}

/* ————— cases ————— */
async function refreshCases() {
  const cases = await api("/api/v1/cases?status=open&limit=50");
  $("casecount").textContent = cases.length ? "· " + cases.length : "";
  const box = $("cases");
  if (!cases.length) { box.innerHTML = '<div class="empty">no open cases</div>'; return; }
  const rank = { critical: 0, warning: 1, serious: 1, info: 2, null: 3 };
  cases.sort((a, b) => (rank[a.severity] ?? 3) - (rank[b.severity] ?? 3));
  box.innerHTML = cases.map((c, i) => `
    <div class="case" data-i="${i}">
      <span class="sev ${esc(c.severity || "info")}">${esc(c.severity || "open")}</span>
      <span class="conf">${c.confidence_pct != null && c.confidence_pct >= 0 && c.confidence_pct <= 100 ? Math.round(c.confidence_pct) + "%" : ""}</span>
      <div class="title">#${c.case_id} ${esc(c.title)}</div>
      <div class="sub">${esc((c.node_id || "").slice(0, 12))} · updated ${fmtAge(c.updated_at)}</div>
      ${c.hypothesis ? `<div class="hyp">${esc(c.hypothesis)}</div>` : ""}
    </div>`).join("");
  box.querySelectorAll(".case").forEach(el =>
    el.addEventListener("click", () => openDrawer(cases[+el.dataset.i])));
}

/* ————— case detail drawer ————— */
function openDrawer(c) {
  const d = c.detail || {};
  const list = (raw) => { try { const v = typeof raw === "string" ? JSON.parse(raw) : raw; return Array.isArray(v) ? v : []; } catch { return []; } };
  const action = (() => {
    try { const a = typeof d.recommended_action === "string" ? JSON.parse(d.recommended_action) : d.recommended_action;
      return a && typeof a === "object" ? `${a.description || ""} <span class="verdict">${esc(a.action_type || "")}</span>` : esc(d.recommended_action || ""); }
    catch { return esc(d.recommended_action || ""); }
  })();
  const chain = (d.reasoning_chain || "").split("\n").filter(Boolean);
  $("drawer").innerHTML = `
    <button class="close" onclick="document.getElementById('drawer').classList.remove('open')">esc</button>
    <span class="sev ${esc(c.severity || "info")}">${esc(c.severity || "open")}</span>
    <h3>#${c.case_id} — ${esc(c.title)}</h3>
    <div class="sub" style="color:var(--ink-mut)">node ${esc(c.node_id)} · opened ${esc(c.opened_at || "?")}</div>
    <dl class="kv">
      <dt>Hypothesis</dt><dd>${esc(c.hypothesis || "pending")}</dd>
      <dt>Confidence</dt><dd>${c.confidence_pct != null && c.confidence_pct >= 0 && c.confidence_pct <= 100 ? Math.round(c.confidence_pct) + "% (calibrated)" : "not calibrated"}</dd>
      <dt>Recommended action (policy-gated, never auto-executed)</dt><dd>${action || "—"}</dd>
      <dt>Reasoning chain</dt><dd><ol class="chain">${chain.map(s => `<li>${esc(s)}</li>`).join("") || "—"}</ol></dd>
      <dt>Evidence</dt><dd>${list(d.evidence).map(e => `<div>· ${esc(e)}</div>`).join("") || "—"}</dd>
      <dt>Tools used</dt><dd>${list(d.tools_used).map(t => `<span class="badge">${esc(t)}</span>`).join("") || "—"}</dd>
      <dt>Model</dt><dd>${esc(d.diagnostician_model || "—")}</dd>
      <dt>Report</dt><dd>${esc(d.report_content || "—")}</dd>
    </dl>`;
  $("drawer").classList.add("open");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") $("drawer").classList.remove("open"); });

/* ————— vitals charts (small multiples, one axis each) ————— */
const METRICS = [
  { key: "util",  label: "GPU util",  unit: "%",  color: "var(--s-util)",  pick: g => g.utilization_pct },
  { key: "temp",  label: "GPU temp",  unit: "°C", color: "var(--s-temp)",  pick: g => g.temperature_c },
  { key: "power", label: "Power",     unit: "W",  color: "var(--s-power)", pick: g => g.power_w },
  { key: "mem",   label: "GPU mem",   unit: "%",  color: "var(--s-mem)",   pick: g => g.mem_utilization_pct },
];

async function selectNode(id, host) {
  selectedNode = id;
  $("vitalshost").textContent = host || id.slice(0, 12);
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("selected", n.dataset.id === id));
  const rows = await api(`/api/v1/vitals/${encodeURIComponent(id)}?hours=1`);
  const series = METRICS.map(m => ({ ...m, pts: [] }));
  rows.forEach(r => {
    const g = (r.gpus || [])[0];
    if (!g) return;
    const t = new Date(r.ts).getTime();
    series.forEach(s => { const v = s.pick(g); if (v != null) s.pts.push([t, v]); });
  });
  $("charts").innerHTML = series.map(s => chartSVG(s)).join("") ||
    '<div class="empty">no vitals in the last hour</div>';
  attachHover(series);
}

function chartSVG(s) {
  const W = 300, Hh = 110, padL = 34, padR = 8, padT = 8, padB = 16;
  if (!s.pts.length) return `<div class="chart"><span class="label">${s.label}</span><div class="empty" style="border:none">no data</div></div>`;
  const xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.12; y0 -= pad; y1 += pad;
  const X = t => padL + (t - x0) / (x1 - x0 || 1) * (W - padL - padR);
  const Y = v => padT + (1 - (v - y0) / (y1 - y0)) * (Hh - padT - padB);
  const path = s.pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const gridVals = [y0 + (y1 - y0) * 0.25, y0 + (y1 - y0) * 0.75];
  const now = ys[ys.length - 1];
  return `<div class="chart" data-key="${s.key}">
    <span class="label" style="color:${s.color}">■ ${s.label}</span>
    <span class="now">${Math.round(now * 10) / 10}${s.unit}</span>
    <svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" data-x0="${x0}" data-x1="${x1}" data-y0="${y0}" data-y1="${y1}">
      ${gridVals.map(v => `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"></line>
        <text class="ticktext" x="2" y="${(Y(v) + 3).toFixed(1)}">${Math.round(v)}</text>`).join("")}
      <line class="axis" x1="${padL}" x2="${W - padR}" y1="${Hh - padB}" y2="${Hh - padB}"></line>
      <path class="series" d="${path}" stroke="${s.color}"></path>
      <line class="crosshair" y1="${padT}" y2="${Hh - padB}" x1="-10" x2="-10"></line>
      <circle r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" cx="-10" cy="-10"></circle>
    </svg></div>`;
}

function attachHover(series) {
  const tip = $("tooltip");
  document.querySelectorAll(".chart svg").forEach((svg, idx) => {
    const s = series.filter(x => x.pts.length)[idx];
    if (!s) return;
    svg.addEventListener("mousemove", (e) => {
      const r = svg.getBoundingClientRect();
      const fx = (e.clientX - r.left) / r.width * 300;
      const x0 = +svg.dataset.x0, x1 = +svg.dataset.x1, y0 = +svg.dataset.y0, y1 = +svg.dataset.y1;
      const t = x0 + (fx - 34) / (300 - 42) * (x1 - x0);
      let best = s.pts[0];
      for (const p of s.pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
      const X = 34 + (best[0] - x0) / (x1 - x0 || 1) * (300 - 42);
      const Y = 8 + (1 - (best[1] - y0) / (y1 - y0)) * (110 - 24);
      svg.querySelector(".crosshair").setAttribute("x1", X); svg.querySelector(".crosshair").setAttribute("x2", X);
      const c = svg.querySelector("circle"); c.setAttribute("cx", X); c.setAttribute("cy", Y);
      tip.style.display = "block";
      tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 10) + "px";
      tip.innerHTML = `<b>${Math.round(best[1] * 10) / 10}${s.unit}</b> <span class="t">${new Date(best[0]).toLocaleTimeString()}</span>`;
    });
    svg.addEventListener("mouseleave", () => {
      tip.style.display = "none";
      svg.querySelector(".crosshair").setAttribute("x1", -10); svg.querySelector(".crosshair").setAttribute("x2", -10);
      const c = svg.querySelector("circle"); c.setAttribute("cx", -10); c.setAttribute("cy", -10);
    });
  });
}

/* ————— live activity stream (SSE over fetch, so we can send auth) ————— */
function describe(a) {
  const d = a.detail || {};
  if (a.activity === "tool_call")
    return `<b>${esc(d.tool_name || "tool")}</b> → ${esc(d.status || "?")} on case #${a.case_id ?? "?"}`;
  if (a.activity === "proposed_action")
    return `proposed <b>${esc(d.action_type || "action")}</b> [${esc(d.policy_verdict || "?")}] on case #${a.case_id ?? "?"}`;
  return esc(a.activity || "");
}
function pushEntry(a) {
  const log = $("feedlog");
  const el = document.createElement("div");
  el.className = "entry";
  el.innerHTML = `<span class="ts">${hhmmss(a.ts)}</span><span class="agent">${esc(a.agent || "?")}</span><span class="what">${describe(a)}</span>`;
  log.prepend(el);
  while (log.children.length > 80) log.lastChild.remove();
}
async function startStream() {
  if (streamAbort) streamAbort.abort();
  streamAbort = new AbortController();
  try {
    const resp = await fetch("/api/v1/stream", { headers: H(), signal: streamAbort.signal });
    if (!resp.ok) throw new Error(resp.status);
    setConn(true);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = chunk.split("\n").filter(l => l.startsWith("data: ")).map(l => l.slice(6)).join("");
        if (!data) continue;
        try { const obj = JSON.parse(data); if (obj.id) pushEntry(obj); } catch {}
      }
    }
  } catch (e) { if (e.name !== "AbortError") setConn(false); }
  if (!streamAbort.signal.aborted) setTimeout(startStream, 5000);
}
function setConn(ok) {
  $("pulse").classList.toggle("live", ok);
  $("connlabel").textContent = ok ? "live" : "disconnected — retrying";
}

/* ————— boot & polling ————— */
async function tick() {
  try { await refreshNodes(); await refreshCases(); setConn(true); }
  catch { setConn(false); }
}
let timer = null;
function boot() {
  if (timer) clearInterval(timer);
  tick();
  // Backfill recent activity, then go live.
  api("/api/v1/activity?limit=30").then(rows => { $("feedlog").innerHTML = ""; rows.forEach(pushEntry); }).catch(() => {});
  startStream();
  timer = setInterval(tick, 10000);
}
boot();
</script>
